name: Release

# Push a tag like v0.2.0 to build the macOS app and attach it to a draft GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  macos:
    name: macOS (${{ matrix.target }})
    runs-on: macos-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: set these repository secrets to sign and notarize the app.
          # Without them the build is unsigned and macOS Gatekeeper will warn on first launch.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: grabnr ${{ github.ref_name }}
          releaseBody: See CHANGELOG.md for what changed.
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}

  cli:
    name: CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            asset: grabnr-macos-arm64.tar.gz
            bin: grabnr
          - os: ubuntu-latest
            asset: grabnr-linux-x86_64.tar.gz
            bin: grabnr
          - os: windows-latest
            asset: grabnr-windows-x86_64.zip
            bin: grabnr.exe
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p grabnr-cli --release
      - name: Package
        shell: bash
        run: |
          mkdir dist-cli && cp "target/release/${{ matrix.bin }}" dist-cli/
          cd dist-cli
          if [[ "${{ matrix.asset }}" == *.zip ]]; then 7z a "../${{ matrix.asset }}" "${{ matrix.bin }}"; else tar czf "../${{ matrix.asset }}" "${{ matrix.bin }}"; fi
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: ${{ matrix.asset }}
