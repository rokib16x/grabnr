name: Release

# Push a tag like v0.2.0 to build the apps and attach them to a draft GitHub release.
# Run it by hand (without a tag) for a dry run: everything is built and kept as workflow artifacts, nothing is released.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  app:
    name: App (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "macOS Apple silicon", os: macos-latest, target: aarch64-apple-darwin, args: "--target aarch64-apple-darwin" }
          - { name: "macOS Intel", os: macos-latest, target: x86_64-apple-darwin, args: "--target x86_64-apple-darwin" }
          - { name: "Linux", os: ubuntu-24.04, target: "", args: "" }
          - { name: "Windows", os: windows-latest, target: "", args: "" }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Linux system libraries for Tauri
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev patchelf
      - run: npm ci
      # Optional: with the MACOS_* and NOTARY_* repository secrets (same names as the hidnr repo) the macOS app is signed
      # and notarized. Without them the build is unsigned. The certificate lives in a keychain that exists only for this job.
      - name: Apple signing
        if: ${{ startsWith(matrix.os, 'macos') }}
        shell: bash
        env:
          APP_CERT_P12: ${{ secrets.MACOS_APP_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          set -euo pipefail
          if [ -z "$APP_CERT_P12" ]; then echo "No Apple certificate: building unsigned."; exit 0; fi
          keychain="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          printf '%s' "$APP_CERT_P12" | base64 --decode > "$RUNNER_TEMP/app.p12"
          security import "$RUNNER_TEMP/app.p12" -k "$keychain" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/app.p12"
          # The Developer ID intermediate is not on the runner; pinned by fingerprint.
          ca="$RUNNER_TEMP/DeveloperIDG2CA.cer"
          curl -fsSL -o "$ca" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          expected="F16CD3C54C7F83CEA4BF1A3E6A0819C8AAA8E4A1528FD144715F350643D2DF3A"
          actual="$(/usr/bin/openssl x509 -inform DER -in "$ca" -noout -fingerprint -sha256 | tr -d ':' | cut -d= -f2)"
          [ "$actual" = "$expected" ] || { echo "::error::Developer ID CA fingerprint mismatch"; exit 1; }
          security import "$ca" -k "$keychain" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$keychain" > /dev/null
          security list-keychain -d user -s "$keychain" login.keychain-db
          security find-identity -v | grep -q "Developer ID Application" || { echo "::error::Developer ID Application certificate missing"; exit 1; }
          echo "APPLE_SIGNING_IDENTITY=Developer ID Application" >> "$GITHUB_ENV"
          if [ -n "$NOTARY_KEY_P8" ]; then
            printf '%s' "$NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
            echo "APPLE_API_KEY=$NOTARY_KEY_ID" >> "$GITHUB_ENV"
            echo "APPLE_API_ISSUER=$NOTARY_ISSUER_ID" >> "$GITHUB_ENV"
            echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"
          fi
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: signs the update packages so installed apps can update themselves (see docs/RELEASING.md).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        with:
          # No tag (a dry run): build only, and keep the results as workflow artifacts.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: grabnr ${{ github.ref_name }}
          releaseBody: See CHANGELOG.md for what changed.
          releaseDraft: true
          prerelease: false
          uploadWorkflowArtifacts: ${{ !startsWith(github.ref, 'refs/tags/') }}
          args: ${{ matrix.args }} ${{ env.HAS_UPDATER_KEY == 'true' && '--config src-tauri/tauri.updater.conf.json' || '' }}

  cli:
    name: CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            asset: grabnr-macos-arm64.tar.gz
            bin: grabnr
          - os: ubuntu-latest
            asset: grabnr-linux-x86_64.tar.gz
            bin: grabnr
          - os: windows-latest
            asset: grabnr-windows-x86_64.zip
            bin: grabnr.exe
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p grabnr-cli --release
      - name: Package
        shell: bash
        run: |
          mkdir dist-cli && cp "target/release/${{ matrix.bin }}" dist-cli/
          cd dist-cli
          if [[ "${{ matrix.asset }}" == *.zip ]]; then 7z a "../${{ matrix.asset }}" "${{ matrix.bin }}"; else tar czf "../${{ matrix.asset }}" "${{ matrix.bin }}"; fi
      - name: Keep as an artifact (dry run)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: ${{ matrix.asset }}

  extension:
    name: Browser extensions
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - run: node extension/tools/build.mjs
      - name: Keep as artifacts (dry run)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: extensions
          path: |
            extension/dist/grabnr-chrome.zip
            extension/dist/grabnr-firefox.zip
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            extension/dist/grabnr-chrome.zip
            extension/dist/grabnr-firefox.zip
