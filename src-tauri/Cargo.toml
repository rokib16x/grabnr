[package]
name = "grabnr"
version = "0.1.0"
description = "Combine every network connection into one fast download"
authors = ["grabnr contributors"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "grabnr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
grabnr-core = { path = "../crates/grabnr-core" }
tauri-plugin-notification = "2.5.1"
tauri-plugin-dialog = "2.8.1"
tiny_http = "0.12.0"
getrandom = "0.4.3"
tokio-util = "0.7.19"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "time"] }



