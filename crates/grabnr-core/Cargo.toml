[package]
name = "grabnr-core"
version = "0.1.0"
edition = "2021"
description = "grabnr download engine: interface discovery, binding and multi-link transfers"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util", "process"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "socks"] }
futures-util = "0.3"
netdev = "0.46"
thiserror = "2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
tokio-util = "0.7.19"
base64 = "0.22"
quick-xml = "0.37"
url = "2"
crc32fast = "1"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
