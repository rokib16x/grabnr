[package]
name = "grabnr-cli"
version = "0.1.3"
edition = "2021"
license = "MIT"

[[bin]]
name = "grabnr"
path = "src/main.rs"

[dependencies]
grabnr-core = { path = "../grabnr-core" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
tokio-util = "0.7"
