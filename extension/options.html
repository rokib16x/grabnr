<!doctype html>
<meta charset="utf-8">
<title>grabnr options</title>
<style>
  body { font: 14px system-ui, sans-serif; max-width: 560px; margin: 24px auto; padding: 0 12px; }
  h2 { font-size: 15px; margin-top: 24px; }
  input[type=text], input[type=password], textarea { width: 100%; box-sizing: border-box; font: inherit; }
  textarea { height: 70px; }
  .hint { color: #666; font-size: 12px; }
  #msg { margin-top: 8px; font-weight: 600; }
</style>
<h1>grabnr</h1>
<h2>Connection</h2>
<p class="hint">Click "Allow pairing" in the grabnr app first (open for 60 seconds), then press Pair.</p>
<button id="pair">Pair</button> <button id="test">Test connection</button>
<p><label>Token (manual)<br><input type="password" id="token" autocomplete="off"></label></p>
<div id="msg"></div>

<h2>Capture</h2>
<label><input type="checkbox" id="enabled"> Capture browser downloads</label>
<p><label>Skip domains (one per line, subdomains included)<br><textarea id="skipDomains"></textarea></label></p>
<p><label>Skip file extensions (one per line or comma separated, e.g. pdf)<br><textarea id="skipExtensions"></textarea></label></p>
<p><label>Minimum size (MB) <input type="number" id="minSizeMB" min="0" step="1" style="width:80px"></label><br>
<span class="hint">0 = capture everything. File size is often unknown when the download starts; unknown sizes are always captured.</span></p>
<button id="save">Save</button>
<script type="module" src="options.js"></script>
